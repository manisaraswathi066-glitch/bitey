{% extends 'base.html' %}

{% block title %}Page Not Found (404) — Bitetech Technologies{% endblock %}

{% block content %}
<section class="py-5 text-center">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="p-5 bg-white rounded-4 border shadow-sm">
          <div class="display-1 fw-bold text-primary mb-3">404</div>
          <h2 class="fw-bold mb-3">Page Not Found</h2>
          <p class="text-muted mb-4">
            The page or project you are looking for may have been moved, updated, or unpublished.
          </p>
          <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">
              <i class="bi bi-house"></i> Return to Homepage
            </a>
            <a href="{{ url_for('main.projects') }}" class="btn btn-outline-navy">
              <i class="bi bi-grid"></i> Browse Projects
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
