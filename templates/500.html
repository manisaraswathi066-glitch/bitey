{% extends 'base.html' %}

{% block title %}Server Error (500) — Bitetech Technologies{% endblock %}

{% block content %}
<section class="py-5 text-center">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="p-5 bg-white rounded-4 border shadow-sm">
          <div class="display-1 fw-bold text-danger mb-3">500</div>
          <h2 class="fw-bold mb-3">Internal Server Error</h2>
          <p class="text-muted mb-4">
            An unexpected error occurred while processing your request. Our technical team has been notified.
          </p>
          <a href="{{ url_for('main.index') }}" class="btn btn-primary">
            <i class="bi bi-house"></i> Return to Homepage
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
